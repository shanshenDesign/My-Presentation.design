id: streetwear
direction: "Bold, culture-led, expressive, and direct."

layout:
  - Strong blocks and assertive hierarchy
  - Controlled collage in promotional areas

typography:
  - Bold display headlines
  - Conventional readable body text

palette:
  - High-contrast foundations
  - One or two strong accents

components:
  - Graphic badges
  - Poster-inspired promotional surfaces

avoid:
  - Fake scarcity and manipulative urgency
  - Illegible all-caps paragraphs
  - Visual noise around checkout or forms

supporting_use:
  - Decorative typography
  - Accent colors
