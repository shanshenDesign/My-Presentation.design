id: risograph
name: Risograph Print
essence: "Soy-ink duotone with grain, misregistration and charming imperfection. The indie press aesthetic."
mood: [indie, warm, energetic, diy-optimistic]

palette:
  paper: "#F4F0E6"
  inks: ["#FF48B0", "#0078BF", "#F8D210", "#00A95C", "#FF6C2F", "#765BA7"]
  rule: "Pick EXACTLY 2 inks per artifact (3 for hero moments). Colors never exist pure — always as ink-on-paper."
  overlap_rule: "Where two inks overlap, use multiply blend — the overlap color is part of the style."

typography:
  display: ["Anton", "Archivo Black", "Bebas Neue"]
  body: ["Space Grotesk", "Work Sans"]
  rules: "Condensed heavy display, often in an ink color. Slight rotation (-1°) on headlines is welcome."

texture_technique:
  - "Visible stochastic grain over everything (5–8% opacity noise)"
  - "Deliberate misregistration: duplicate a layer in the second ink, offset 1–3px"
  - "Halftone dots for shading"
  - "Flat ink areas, never smooth gradients — use dot screens instead"

layout:
  grid: "Zine logic: strong columns, but images and shapes may bleed off edges."
  spacing: "Punchy and dense, with one breathing area per section."
  frames: "None — full-bleed ink blocks."

motion:
  style: "Print-come-alive: layers register on scroll (offset snaps to 0). Grain flickers subtly."
  duration: fast
  forbid: [soft-shadows, glass, 3d-perspective]

imagery:
  treatment: "Photos reduced to 2-ink duotone with halftone. Illustrations flat with grain."
  signature_prompt: "risograph print illustration, two-color soy ink (hot pink and blue) on cream paper, visible grain texture, slight misregistration offset, halftone dot shading, zine aesthetic, flat graphic shapes"

components:
  buttons: "Flat ink fill; hover swaps the two inks (bg↔fg swap), instant."
  cards: "Paper-colored with 2px ink border and misregistered second border."
  texture_overlay: "One global grain layer, pointer-events none."

dos:
  - "Embrace the overlap color where inks cross"
  - "Offset headline duplicates for misregistration"
  - "Keep ink count sacred: two"
donts:
  - "No gradients, no blur, no photorealism"
  - "No pure #000 — use dark ink at 90%"
  - "No drop shadows; riso shadows are halftone patches"
pairs_with: [memphis, brutalism]
