id: botanical
name: Botanical
essence: "The naturalist's sketchbook. Illustrated flora, herbarium elegance, and organic calm rooted in science."
mood: [fresh, nurturing, artisanal, quietly-luxurious]

palette:
  bg: "#F6F4EC"            # herbarium paper
  ink: "#2E3A2E"           # deep leaf
  greens: ["#4A6741", "#7A9B6D", "#A8BFA0"]
  accents: ["#C08552", "#D9A5B3"]  # terracotta, dried-rose
  note: "Nature-mixed greens, never pure RGB green. Earth tones support; one dried-floral accent."

typography:
  display: ["Fraunces", "Cormorant Garamond", "EB Garamond"]
  body: ["Source Serif 4", "Karla"]
  labels: ["Space Mono"]   # specimen-label mono, uppercase, tiny
  rules: "Serif for warmth; mono micro-labels (SPECIMEN 01 — LAVANDULA) for the herbarium charm."

texture_technique:
  - "Detailed botanical illustrations (line + light wash) of real species"
  - "Pressed-flower flatness for decorative clusters"
  - "Paper grain 4%, occasional deckle edges"
  - "Thin 1px 'specimen card' borders with corner tape marks"

layout:
  grid: "Herbarium sheet: specimens arranged with breathing room, labeled precisely."
  spacing: "Natural, unforced, generous."
  frames: "Hairline botanical-plate borders; torn-paper edges for casual sections."

motion:
  style: "Plants sway almost imperceptibly (rotate ±1°, 4s). Illustrations draw on like ink sketches."
  duration: slow
  forbid: [neon, glitch, mechanical-snap]

imagery:
  treatment: "Scientific botanical illustration style — detailed, labeled, beautiful. Photos only if soft and earthy."
  signature_prompt: "vintage botanical illustration, detailed scientific plant drawing with delicate line work and light watercolor wash, herbarium specimen style on aged cream paper, labeled in fine typography, naturalist sketchbook aesthetic, muted greens and earth tones"

components:
  buttons: "Leaf-green solid or hairline ghost with serif label; hover grows a tiny leaf flourish."
  cards: "Specimen cards: hairline border, mono label strip, illustration on top."
  dividers: "A single stem with leaves running horizontally."

dos:
  - "Name real plants in labels — specificity is the charm"
  - "Cluster illustrations in corners, growing inward"
  - "Mix precise mono labels with warm serif headlines"
donts:
  - "No generic clip-art leaves — botanical accuracy matters"
  - "No saturated tech-greens"
  - "No heavy borders or dark mode (this style lives in daylight)"
pairs_with: [watercolor, vintage-engraving]
