id: oil-painting
name: Oil Painting
essence: "Old-master gravitas. Impasto texture, chiaroscuro light, museum-level richness. Weight and permanence."
mood: [majestic, profound, luxurious, timeless]

palette:
  bg: "#141210"            # umber black
  surface: "#1E1A16"
  ink: "#EDE4D3"           # canvas linen
  primary: "#B08D57"       # aged gold
  deep: ["#5B2C2C", "#2E4057", "#4A5D3A"]  # oxblood, prussian, olive
  note: "Dark, earthy, mineral. Light is CARVED out of darkness. Highlights in warm linen-gold."

typography:
  display: ["Cormorant Garamond", "Playfair Display", "Cinzel"]
  body: ["Source Serif 4", "Lora", "Crimson Pro"]
  rules: "All serif. Display in small-caps or italic swashes for hero lines. Wide measure, book-like typography."

texture_technique:
  - "Canvas weave visible at close zoom (3–5% overlay)"
  - "Dramatic directional light: single source, deep shadows (chiaroscuro)"
  - "Craquelure (fine crackle) on large flat areas, subtle"
  - "Gilded frames around hero imagery"

layout:
  grid: "Gallery hang: centered masterpieces with museum-label captions. Very wide margins."
  spacing: "Monumental. 128px+ section rhythm."
  frames: "Ornate or simple gilt frames around imagery; thin double rules around text blocks."

motion:
  style: "Candlelit stillness. Slow ken-burns on paintings, captions fade like gallery lights dimming up."
  duration: hero
  forbid: [playful-bounce, fast-slides, neon-anything]

imagery:
  treatment: "Oil-painted or convincingly painterly. Portraits, still lifes, landscapes with visible brushwork."
  signature_prompt: "classical oil painting, dramatic chiaroscuro lighting, visible impasto brushstrokes, rich earthy palette of umber ochre and deep crimson, museum masterpiece style, canvas texture, rembrandt lighting"

components:
  buttons: "Understated: thin gold border, serif small-caps label, hover = warm glow like candlelight."
  cards: "Dark umber panels with gilt keyline."
  captions: "Museum-label style: small, italic, generous leading."

dos:
  - "One hero painting per view, lit dramatically"
  - "Treat text blocks like gallery placards"
  - "Keep UI chrome nearly invisible — the art is the interface"
donts:
  - "No bright saturated modern colors"
  - "No flat vector illustration"
  - "No fast or bouncy motion"
pairs_with: [vintage-engraving, ornamental]
