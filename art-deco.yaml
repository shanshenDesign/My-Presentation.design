id: art-deco
name: Art Deco
essence: "Jazz-age glamour: symmetrical geometry, sunbursts, stepped forms, and gilded precision. Opulence through order."
mood: [glamorous, confident, ceremonial, timeless-luxury]

palette:
  bg: "#0E1A1F"            # deep teal-black
  surface: "#132830"
  ink: "#F4EDDE"           # ivory
  primary: "#D4AF37"       # gold
  secondary: "#8C6A2F"     # antique bronze
  accent: "#3E7C74"        # peacock teal
  note: "Gold is the accent, never the background wash. Ivory-on-teal for text."

typography:
  display: ["Marcellus", "Cinzel", "Playfair Display"]
  body: ["Jost", "Montserrat", "Lato"]
  rules: "All-caps display with wide tracking (0.15em+). Thin gold rules above/below headlines. Numerals in display face."

texture_technique:
  - "Sunburst/fan motifs radiating from focal point"
  - "Stepped chevron and ziggurat borders"
  - "Thin double-line frames (1px + 3px pair)"
  - "Subtle vertical pinstripe or lacquer sheen on surfaces"

layout:
  grid: "Strictly symmetrical, centered axis. Hero = vertical monument."
  spacing: "Ceremonial: large top/bottom padding (96–128px sections)."
  frames: "Every key panel gets a geometric border."

motion:
  style: "Slow, stately reveals. Gold lines draw themselves (stroke animation). Fan elements unfold."
  duration: slow
  forbid: [bouncy-easing, glitch, parallax-chaos]

imagery:
  treatment: "Duotone photos in gold/teal, or geometric illustrations. Skyscrapers, fans, leaping figures."
  signature_prompt: "elegant 1920s art deco illustration, gold foil lines on deep teal-black, symmetrical sunburst composition, geometric fan motifs, luxurious, Gatsby-era poster style"

components:
  buttons: "Rectangular, thin gold border, uppercase label, hover = gold fill sweep from center."
  cards: "Dark surface, double-line border, corner fan ornaments."
  dividers: "Diamond-centered double rule."

dos:
  - "Radiate ornament from the focal point, not everywhere"
  - "Use symmetry religiously"
  - "Let gold catch light (gradients on metal only)"
donts:
  - "No rounded bubbly shapes — Deco is sharp or streamlined, never cute"
  - "No more than 3 colors in view"
  - "No casual sans-serif body in all caps"
pairs_with: [ornamental, metallic-chrome]
