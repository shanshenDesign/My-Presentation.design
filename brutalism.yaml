id: brutalism
name: Brutalism (Digital)
essence: "Raw honesty. Exposed structure, system fonts, harsh contrast, zero cosmetic politeness. The anti-template."
mood: [confrontational, honest, underground, confident]

palette:
  bg: "#FFFFFF"
  ink: "#000000"
  primary: "#0000FF"       # hyperlink blue
  accent: "#FF00FF"        # optional scream
  note: "Black, white, one loud color. Sometimes inverted full-black sections. That's it."

typography:
  display: ["Arial Black", "Helvetica Now Display", "system-ui bold"]
  mono: ["Space Mono", "IBM Plex Mono", "monospace"]
  body: ["Arial", "Helvetica", "system-ui"]
  rules: "System fonts are the aesthetic. Mono for meta/labels. Extreme size contrast: 12px labels vs 100px+ headlines."

texture_technique:
  - "Thick raw borders (2–4px black)"
  - "Hard offset shadows (4px 4px 0 #000), no blur"
  - "Visible 'construction': default-looking tables, HR rules, raw lists"
  - "Stickers/tape/marquee accents allowed sparingly"

layout:
  grid: "Deliberately exposed. Overlaps and collisions are allowed IF intentional and readable."
  spacing: "Unapologetic density next to void-like emptiness."
  frames: "Everything boxed in black strokes."

motion:
  style: "Instant or mechanical. Marquees, hard cuts, cursor-follow jolts."
  duration: fast
  forbid: [eased-floaty, soft-fade-cascades]

imagery:
  treatment: "Unretouched photos, scans, screenshots. Or none — type-only is valid."
  signature_prompt: "raw brutalist web design poster, black and white, huge grotesque typography, thick black borders, harsh offset shadows, exposed grid, anti-design aesthetic, xerox texture"

components:
  buttons: "Black-bordered white rectangles, hard shadow. Hover = invert instantly (no transition)."
  inputs: "2px black border, no radius, mono placeholder."
  cards: "White box, 3px border, hard shadow. Title bar like an OS window is allowed."

dos:
  - "Be intentionally rough, never accidentally broken"
  - "Use mono microcopy labels like SYSTEM/01, NAV.EXE"
  - "Contrast huge and tiny type aggressively"
donts:
  - "No soft shadows, no rounded pills, no gradients"
  - "No chaos that hurts readability — brutal ≠ unusable"
  - "No more than one accent color"
pairs_with: [bauhaus, vaporwave]
