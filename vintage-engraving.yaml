id: vintage-engraving
name: Vintage Engraving
essence: "Copperplate authority. Crosshatch shading, letterpress bite, and the trust of a 19th-century bank note."
mood: [authoritative, crafted, heritage, substantial]

palette:
  bg: "#F1EAD8"            # aged stock
  ink: "#211A12"           # printer's ink (warm black)
  single_accent: "#7A2E2E" # oxblood, OR "#2E4A62" prussian — pick ONE
  note: "Essentially one-color printing. Shading comes from line density, not gray fills."

typography:
  display: ["Playfair Display SC", "Cinzel", "Libre Caslon Text"]
  body: ["EB Garamond", "Source Serif 4"]
  rules: "Period typography: small caps, old-style numerals, em-dash generosity. Occasional roman numerals (EST. MMXVII)."

texture_technique:
  - "Crosshatch and stipple shading for ALL imagery"
  - "Letterpress impression: 1px light deboss under text blocks"
  - "Ornamental rules and star/asterism separators (✳ ❦ —)"
  - "Slightly uneven ink density (2–3% noise) for printed authenticity"

layout:
  grid: "Centered, label-like compositions (think whiskey bottle or bank note). Strong vertical axis."
  spacing: "Dense engraving fields separated by clear white space."
  frames: "Engraved border systems with corner cartouches; inner keyline."

motion:
  style: "Practically still. A subtle letterpress 'press' on page load (1px settle). Nothing moves after."
  duration: instant
  forbid: [float-animation, parallax, glow]

imagery:
  treatment: "Copperplate/wood-engraving illustration: animals, ships, portraits, machinery in crosshatch."
  signature_prompt: "vintage copperplate engraving illustration, intricate crosshatch line shading, 19th century etching style, single warm black ink on aged cream paper, banknote or antique book plate aesthetic, detailed ornamental borders, letterpress print quality"

components:
  buttons: "Engraved-border rectangles, small-caps serif label; hover = ink darkens, as if re-inked."
  cards: "Label panels with keyline borders and asterism separators."
  badges: "Circular 'established' seals with radiating text."

dos:
  - "Shade with line density only — no smooth gray gradients"
  - "Compose like a bottle label: top arc text, central emblem, bottom details"
  - "Keep it monochrome + one accent"
donts:
  - "No photography unless converted to engraved halftone"
  - "No modern UI chrome (pills, gradients, glass)"
  - "No animation beyond the initial press"
pairs_with: [ornamental, oil-painting]
