id: geometric-abstract
name: Geometric Abstract
essence: "Pure shape systems. Circles, arcs and blocks composed with mathematical confidence — Bauhaus' contemporary heir."
mood: [confident, systematic, modern, optimistic]

palette:
  bg: "#FFFFFF"
  ink: "#101828"
  system: ["#4361EE", "#F72585", "#FFB703", "#06D6A0", "#7209B7"]
  note: "Pick 3 from the system + ink + white per view. Flat fills only. One shape family per composition: rounds OR angles."

typography:
  display: ["Sora", "Space Grotesk", "General Sans"]
  body: ["Inter", "Work Sans"]
  rules: "Geometric sans to echo the shapes. Big bold headlines; shapes and type interact (type inside circles, shapes underlining words)."

texture_technique:
  - "Modular shape library: circles, half-circles, quarter arcs, pills, triangles"
  - "Compositions built like tangrams — shapes interlock, no random scatter"
  - "Shape masking: photos and color fields live inside geometric crops"
  - "Optional fine outline versions of the same shapes as secondary layer"

layout:
  grid: "Strict underlying grid (12-col); shapes snap to it even when compositions look free."
  spacing: "Clean product spacing; shape compositions act as section heroes."
  frames: "Shapes themselves are the framing device."

motion:
  style: "Shape choreography: arcs rotate into place, circles scale from 0, shapes assemble on scroll (stagger 60ms)."
  duration: base
  forbid: [organic-wobble, blur, texture-noise]

imagery:
  treatment: "Flat vector geometry; photography only inside geometric masks (circle portraits, arch crops)."
  signature_prompt: "geometric abstract composition, bold flat shapes circles arcs and blocks interlocking like tangram, limited palette of cobalt pink amber on white, modern bauhaus-inspired design, clean vector style, confident minimal layout, no gradients"

components:
  buttons: "Solid system-color pill or rectangle; hover = shape swap animation (circle expands from click point)."
  cards: "White with one geometric corner element; radius consistent with shape family."
  patterns: "Repeatable shape patterns for section backgrounds at 5–8% opacity."

dos:
  - "Build a small shape kit and reuse it obsessively"
  - "Let shapes interact with headlines (wrap, underline, contain)"
  - "Keep compositions asymmetric but balanced by visual weight"
donts:
  - "No more than 3 system colors per view"
  - "No gradients or shadows on shapes — pure flat confidence"
  - "No mixing round and sharp families in one composition"
pairs_with: [bauhaus, memphis]
