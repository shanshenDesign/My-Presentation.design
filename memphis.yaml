id: memphis
name: Memphis Design
essence: "1980s design rebellion. Squiggles, confetti, bold shapes and unapologetic fun. Rules are for other styles."
mood: [loud, joyful, irreverent, energetic]

palette:
  bg: "#FFF8EC"            # warm cream
  ink: "#111111"
  colors: ["#FF5DA2", "#FFDD00", "#00C2CB", "#7B61FF", "#FF6B35", "#06D6A0"]
  note: "Maximum 4 brights per view + black + cream. Flat, fully saturated, zero gradients."

typography:
  display: ["Archivo Black", "Bricolage Grotesque", "Clash Display"]
  body: ["Space Grotesk", "Work Sans"]
  rules: "Chunky display, sometimes outlined or with a hard offset color shadow (3px, no blur). Sentence case with attitude."

texture_technique:
  - "Confetti field: squiggles, zigzags, dots, crosses, half-moons scattered at 10–20% density"
  - "Black-and-white patterns: stripes, checkerboard, dot grids as fills"
  - "Shapes get hard offset shadows in a contrasting flat color"
  - "Thick outlines (2–3px black) around key shapes"

layout:
  grid: "Organized chaos: real grid underneath, elements playfully rotated (-4° to 4°) and overlapping."
  spacing: "Dense and buzzy, but text blocks stay clean and readable."
  frames: "Thick black borders, ticket-stub notches, zigzag section edges."

motion:
  style: "Party physics: confetti drifts, shapes wiggle (rotate ±2°), hover = pop scale 1.05."
  duration: fast
  forbid: [elegant-fades, slow-kenburns]

imagery:
  treatment: "Flat vector illustration in the 4-color scheme. Photos cut into geometric masks with thick outlines."
  signature_prompt: "memphis design style illustration, 1980s postmodern graphic design, bold squiggles zigzags and geometric confetti, saturated pink yellow teal purple on cream, black outlines, playful patterns, flat vector, energetic composition"

components:
  buttons: "Solid bright + 3px hard black offset shadow. Hover: shadow shifts, button moves -2px. Border 2px black."
  cards: "White, 2px black border, one pattern-filled corner, hard color shadow."
  stickers: "Starburst/arrow stickers for CTAs and prices."

dos:
  - "Balance: one chaotic zone + one calm zone per viewport"
  - "Give every important element a thick outline and hard shadow"
  - "Rotate things slightly — stiffness kills Memphis"
donts:
  - "No gradients, soft shadows, or glassmorphism"
  - "No more than 4 brights per view"
  - "Never let confetti touch body text"
pairs_with: [risograph, geometric-abstract]
