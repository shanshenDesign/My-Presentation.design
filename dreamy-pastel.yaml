id: dreamy-pastel
name: Dreamy Pastel
essence: "Weightless calm. Soft gradients, cloudlike surfaces, and light that feels like morning. The exhale of design."
mood: [soothing, tender, optimistic, weightless]

palette:
  bg: "#FDF9FB"
  washes: ["#FDE2E4", "#E2ECE9", "#CDE7F0", "#FFF1C9", "#E4C1F9"]
  ink: "#4A4458"           # soft plum-charcoal, NEVER pure black
  note: "Pastels at 20–40% saturation. Gradients blend 2–3 pastels diagonally. Text color is softened, but MUST still pass 4.5:1."

typography:
  display: ["Sora", "Outfit", "General Sans"]
  body: ["Nunito", "Quicksand", "Inter"]
  rules: "Rounded geometric sans, regular-to-medium weights. Nothing bold-black; semibold is the ceiling."

texture_technique:
  - "Large soft gradient meshes (blur 60px+) as background atmosphere"
  - "Frosted-glass cards (blur 12–16px, 40–60% white) floating over gradients"
  - "Feathered shadows: 0 12px 40px rgba(120,100,160,0.12) — colored, not gray"
  - "Optional: soft grain 3% to keep gradients from banding"

layout:
  grid: "Centered, spacious, floating islands of content."
  spacing: "Extra-generous; elements should feel buoyant."
  frames: "radius-lg to pill everywhere; zero sharp corners."

motion:
  style: "Slow drift: gradients breathe (hue shift ±5° over 8s), cards float ±3px. Everything ease-out."
  duration: slow
  forbid: [hard-borders-slam, glitch, fast-anything]

imagery:
  treatment: "Soft-focus photography, 3D blobs, cloud/sky imagery, gentle illustration with round forms."
  signature_prompt: "dreamy pastel aesthetic, soft gradient mesh background in blush pink lavender and baby blue, fluffy clouds, soft glowing light, weightless airy atmosphere, smooth 3d blob shapes, gentle ethereal mood, high key lighting"

components:
  buttons: "Pill-shaped, soft gradient or white-on-glass; hover lifts with a deepening colored shadow."
  cards: "Frosted glass over gradient; 1px white/40% inner border."
  inputs: "Filled pastel-tint fields, pill radius, no hard borders."

dos:
  - "Blur and float everything — but keep text razor-sharp"
  - "Use colored shadows that match the pastel above them"
  - "Design for calm: fewer elements, more air"
donts:
  - "No pure black anywhere"
  - "No sharp corners or hard 1px gray borders"
  - "No saturated neon accents"
pairs_with: [watercolor, holographic]
